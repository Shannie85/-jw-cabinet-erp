<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>员工打卡</title>
<style>
:root{--blue:#2f8cf0;--orange:#ff8a1f;--purple:#a45be8;--ink:#1d2433;--mute:#7b8496;--bg:#f4f7fb;--green:#1fa760;--red:#e5484d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#dfe6f0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;color:var(--ink)}
#app{max-width:430px;min-height:100vh;margin:0 auto;background:var(--bg);position:relative;overflow:hidden;padding-bottom:84px}
.hero{background:linear-gradient(180deg,#2f8cf0 0%,#6bb6ff 70%,#f4f7fb 100%);padding:max(18px,env(safe-area-inset-top)) 16px 0;height:330px;position:relative}
.hero:after{content:"";position:absolute;left:-10%;right:-10%;bottom:-40px;height:140px;background:var(--bg);border-radius:50% 50% 0 0/100% 100% 0 0}
.greet{display:flex;gap:10px;align-items:center}
.pill{flex:1;background:#fff;border-radius:40px;padding:8px 14px 8px 8px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 14px #0001}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#ffb36b,#ff6f91);color:#fff;font-weight:700;display:grid;place-items:center;font-size:18px}
.pill b{display:block;font-size:15px}.pill small{color:var(--mute);font-size:12px}
.bell{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px;border:0;box-shadow:0 4px 14px #0001;position:relative}
.bell i{position:absolute;top:4px;right:2px;background:var(--red);color:#fff;font-size:10px;border-radius:9px;padding:1px 5px;font-style:normal}
.where{color:#fff;font-size:13px;margin:14px 6px 0}
.status{color:#fff;margin:6px 6px 0;font-size:13px}
.big{font-size:34px;font-weight:700;color:#fff;margin:6px 6px 0;letter-spacing:1px}
.btns{position:absolute;left:0;right:0;top:215px;z-index:2;display:flex;justify-content:center;align-items:center;gap:26px}
.cbtn{border:0;border-radius:50%;color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 20px #0003;transition:transform .12s}
.cbtn:active{transform:scale(.94)}
.cbtn.s{width:62px;height:62px;font-size:26px}
.cbtn.m{width:104px;height:104px;font-size:44px;background:radial-gradient(circle at 35% 30%,#ffb066,var(--orange));box-shadow:0 0 0 10px #ff8a1f33,0 10px 24px #ff8a1f66}
.cbtn.m.out{background:radial-gradient(circle at 35% 30%,#ff8f95,var(--red));box-shadow:0 0 0 10px #e5484d33,0 10px 24px #e5484d66}
.cbtn.wifi{background:var(--blue)}.cbtn.nfc{background:var(--purple)}
.lbl{position:absolute;top:330px;left:0;right:0;text-align:center;font-size:12px;color:var(--mute);z-index:2}
.sec{padding:0 16px;margin-top:22px}
.sec h3{margin:0 0 12px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px}
.qa{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--ink);cursor:pointer;padding:0;position:relative}
.qa i{width:52px;height:52px;border-radius:50%;background:#fdf1de;display:grid;place-items:center;font-style:normal;font-size:24px}
.qa em{position:absolute;top:-2px;right:10px;background:var(--red);color:#fff;font-size:10px;border-radius:9px;padding:1px 6px;font-style:normal}
.today{margin:44px 16px 0;background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 10px #0000000d}
.today .row{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;display:flex;justify-content:space-around;padding:8px 0 max(8px,env(safe-area-inset-bottom));box-shadow:0 -4px 16px #0001;z-index:20}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mute);gap:2px;cursor:pointer}
.nav button span{font-size:22px}.nav .on{color:var(--blue);font-weight:600}
.toast{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translate(-50%,-140%);width:calc(100% - 28px);max-width:400px;background:#fff;border-radius:18px;padding:14px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px #0003;z-index:80;transition:transform .35s cubic-bezier(.2,1.2,.4,1)}
.toast.show{transform:translate(-50%,0)}
.toast .ic{width:48px;height:48px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:24px;flex:none}
.toast.err .ic{background:var(--red)}
.toast b{display:block;font-size:17px}.toast small{color:var(--mute);font-size:14px}
.page{display:none;padding:max(18px,env(safe-area-inset-top)) 16px 20px}
.page h2{margin:0 0 14px}
.card{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:12px;box-shadow:0 2px 10px #0000000d}
.card .hd{display:flex;justify-content:space-between;font-weight:600;margin-bottom:6px;align-items:center}
.rec{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid #eef1f6;font-size:14px}
.rec img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.chip{font-size:11px;padding:2px 9px;border-radius:10px;color:#fff;background:#aab3c4;white-space:nowrap}
.c-正常,.c-ok{background:var(--green)}.c-迟到,.c-早退,.c-迟到早退,.c-pm,.c-hr{background:#f08a1f}.c-缺勤,.c-漏打卡,.c-no,.c-未到岗{background:var(--red)}.c-请假{background:var(--blue)}.c-上班中{background:#0e9aa7}
.sub{color:var(--mute);font-size:12.5px;display:block}
.modal{position:fixed;inset:0;background:#000c;z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:20px;color:#fff;text-align:center}
.modal.show{display:flex}
.cam{width:min(78vw,300px);aspect-ratio:3/4;border-radius:50%/40%;overflow:hidden;border:4px solid #fff;background:#222}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.btn{border:0;border-radius:30px;padding:13px 30px;font-size:16px;font-weight:600;color:#fff;background:var(--orange);cursor:pointer}
.btn.g{background:#fff3}.btn.b{background:var(--blue)}.btn.w{width:100%}
.sheet{position:fixed;inset:0;background:#0008;z-index:55;display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.sheet>div{background:#fff;width:100%;max-width:430px;border-radius:22px 22px 0 0;padding:20px 18px max(20px,env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 12px}
.f{display:grid;gap:10px}.f label{display:grid;gap:4px;color:var(--mute);font-size:13px}
.f input,.f select,.f textarea{font:inherit;padding:11px;border:1px solid #d8dfeb;border-radius:10px;color:var(--ink);background:#fff;font-size:15px}
.set{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px}
.set p{color:var(--mute);font-size:13px;margin:4px 0 10px}
.set select{width:100%;padding:10px;border:1px solid #d8dfeb;border-radius:10px;font-size:15px}
.set a{color:var(--blue)}
.sch{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid #eef1f6;font-size:14px}
</style>
</head>
<body>
<div id="app">
  <div class="toast" id="toast"><div class="ic" id="tIc">✓</div><div><b id="tT"></b><small id="tS"></small></div></div>

  <section id="home">
    <div class="hero">
      <div class="greet">
        <div class="pill"><div class="avatar" id="av">?</div><div><b id="hello">你好</b><small id="now">—</small></div></div>
        <button class="bell" onclick="go('requests')">🔔<i id="bellN" style="display:none"></i></button>
      </div>
      <div class="where" id="where"></div>
      <div class="status" id="status"></div>
      <div class="big" id="big">--:--</div>
    </div>
    <div class="btns">
      <button class="cbtn s wifi" onclick="wifi()" aria-label="WiFi打卡">📶</button>
      <button class="cbtn m" id="mainBtn" onclick="clock('GPS定位')" aria-label="定位打卡">📍</button>
      <button class="cbtn s nfc" onclick="nfc()" aria-label="NFC打卡">((·))</button>
    </div>
    <div class="lbl" id="mainLbl"></div>
    <div class="today">
      <div class="row"><span>今天班次</span><b id="tShift">—</b></div>
      <div class="row"><span>今天上班</span><b id="tIn">—</b></div>
      <div class="row"><span>今天下班</span><b id="tOut">—</b></div>
      <div class="row"><span>今天已工作</span><b id="tHrs">—</b></div>
    </div>
    <div class="sec">
      <h3>快捷功能</h3>
      <div class="grid">
        <button class="qa" onclick="go('history')"><i>🗓️</i>打卡记录</button>
        <button class="qa" onclick="go('schedule')"><i>📆</i>我的排班</button>
        <button class="qa" onclick="form('leave')"><i>🏖️</i>请假</button>
        <button class="qa" onclick="form('overtime')"><i>⏰</i>加班申请</button>
        <button class="qa" onclick="form('fix')"><i>📝</i>补卡申请</button>
        <button class="qa" onclick="go('requests')"><i>📋</i>我的申请<em id="qaN" style="display:none"></em></button>
        <a class="qa" id="adminLink" href="hr.html" style="display:none;text-decoration:none"><i>🖥️</i>主管后台</a>
        <button class="qa" onclick="go('settings')"><i>⚙️</i>设置</button>
      </div>
    </div>
  </section>

  <section class="page" id="history"><h2>打卡记录（近30天）</h2><div id="histList"></div></section>
  <section class="page" id="schedule"><h2>我的排班</h2><div class="card" id="schList"></div></section>
  <section class="page" id="requests"><h2>我的申请</h2>
    <div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn b" style="flex:1;padding:10px" onclick="form('leave')">请假</button><button class="btn b" style="flex:1;padding:10px" onclick="form('overtime')">加班</button><button class="btn b" style="flex:1;padding:10px" onclick="form('fix')">补卡</button></div>
    <div id="reqList"></div></section>
  <section class="page" id="settings">
    <h2>设置</h2>
    <div class="set"><b>我的账号</b><p id="acctInfo"></p><button class="btn b w" onclick="pwSheet()">修改密码</button><div style="height:10px"></div><button class="btn w" style="background:#8a93a6" onclick="DB.logout()">退出登录</button></div>
    <div class="set"><b>办公室打卡范围</b><p id="offInfo"></p></div>
  </section>

  <nav class="nav">
    <button class="on" data-p="home" onclick="go('home')"><span>🏠</span>首页</button>
    <button data-p="history" onclick="go('history')"><span>🗓️</span>记录</button>
    <button data-p="requests" onclick="go('requests')"><span>📋</span>申请</button>
    <button data-p="settings" onclick="go('settings')"><span>⚙️</span>设置</button>
  </nav>

  <div class="modal" id="cam">
    <div style="font-size:18px;font-weight:600">请看着镜头</div>
    <div class="cam"><video id="vid" autoplay playsinline muted></video></div>
    <div id="camMsg" style="font-size:14px;opacity:.85">拍一张自拍作为打卡证明</div>
    <div style="display:flex;gap:12px"><button class="btn g" onclick="camCancel()">取消</button><button class="btn" onclick="shoot()" id="shotBtn">拍照打卡</button></div>
  </div>
  <div class="sheet" id="sheet"><div id="sheetBody"></div></div>
</div>

<script src="supabase.js"></script>
<script src="store.js"></script>
<script>
const {pad,ymd,addDays,at,hm,dow,prevWork}=DB.util;
const $=id=>document.getElementById(id);
const wk=['周日','周一','周二','周三','周四','周五','周六'];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me=null;
let curPage='home';

let tt;function toast(t,s,err){$('tT').textContent=t;$('tS').textContent=s||'';$('tIc').textContent=err?'!':'✓';$('toast').classList.toggle('err',!!err);$('toast').classList.add('show');clearTimeout(tt);tt=setTimeout(()=>$('toast').classList.remove('show'),3800)}
function go(p){curPage=p;['home','history','schedule','requests','settings'].forEach(x=>$(x).style.display=x===p?'block':'none');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));render();scrollTo(0,0)}

/* ---------- 画面 ---------- */
function render(){
  me=DB.me();
  const d=new Date(),t=ymd(d),s=DB.summary(me.id,t);
  $('now').textContent=`${wk[d.getDay()]}, ${t} ${hm(d)}`;$('big').textContent=hm(d);
  $('hello').textContent='你好，'+me.name;$('av').textContent=me.name[0].toUpperCase();
  const o=DB.office();$('where').textContent='📍 '+(o?o.name:'办公室未设定（去设置里设定）');
  const nt=DB.nextType(me.id);
  $('mainBtn').classList.toggle('out',nt==='out');
  $('status').textContent=s.status==='请假'?'🏖️ 今天请假':!s.sh?'今天休息 😴':nt==='out'?'✅ 已上班，下班时再点一次':'还没上班打卡';
  $('mainLbl').textContent=nt==='out'?'点红色按钮：下班打卡':'点橙色按钮：上班打卡（定位 + 自拍）';
  $('tShift').textContent=s.sh?`${s.sh.name} ${s.sh.start}-${s.sh.end}`:(s.status==='请假'?'请假':'休息');
  $('tIn').textContent=s.inT?hm(s.inT)+(s.late?`（迟到${s.late}分）`:''):'—';
  $('tOut').textContent=s.outT?hm(s.outT):'—';
  $('tHrs').textContent=s.workMin?`${Math.floor(s.workMin/60)}小时${pad(s.workMin%60)}分`:'—';
  const mine=DB.requests().filter(q=>q.empId===me.id&&(q.status==='pm'||q.status==='hr')).length;
  [$('bellN'),$('qaN')].forEach(x=>{x.style.display=mine?'':'none';x.textContent=mine});
  $('adminLink').style.display=me.role!=='employee'?'':'none';
  if(curPage==='history')renderHist();if(curPage==='schedule')renderSch();if(curPage==='requests')renderReq();if(curPage==='settings')renderSet();
}
setInterval(async()=>{if(me&&!$('cam').classList.contains('show')&&!$('sheet').classList.contains('show')){try{await DB.reload()}catch(e){}render()}},30000);

function renderHist(){const t=ymd(new Date());let h='';
  for(let i=0;i<30;i++){const d=addDays(t,-i),s=DB.summary(me.id,d);if(s.status==='休息'||s.status==='未开始'||(s.status==='未上班'))continue;
    h+=`<div class="card"><div class="hd"><span>${d} ${wk[dow(d)]}</span><span class="chip c-${s.status}">${s.status}</span></div>`+
     (s.recs.map(r=>`<div class="rec">${r.hasPhoto?`<button onclick="showPhoto('${r.id}')" style="border:0;background:#eef2f9;border-radius:50%;width:36px;height:36px;font-size:16px">📷</button>`:''}<div style="flex:1"><b>${r.type==='in'?'🟢 上班':'🔴 下班'} ${hm(new Date(r.t))}</b><span class="sub">${esc(r.method)}${r.dist?' · '+r.dist+'米':''}${r.face?' · 人脸✓':''}${r.source==='assist'?' · 主管协助':''}${r.source==='fix'?' · 补卡':''}</span></div></div>`).join('')||`<span class="sub">没有打卡记录${s.status==='缺勤'?'，可以提交补卡申请':''}</span>`)+
     (s.late||s.early||s.otOk?`<span class="sub" style="margin-top:6px">${s.late?`迟到${s.late}分钟 `:''}${s.early?`早退${s.early}分钟 `:''}${s.otOk?`加班${(s.otOk/60).toFixed(1)}小时`:''}</span>`:'')+`</div>`}
  $('histList').innerHTML=h||'<p style="color:#7b8496">还没有打卡记录</p>'}
function renderSch(){const t=ymd(new Date());let h='';for(let i=0;i<14;i++){const d=addDays(t,i),sh=DB.shiftOf(me.id,d);h+=`<div class="sch"><span>${d.slice(5)} ${wk[dow(d)]}${i===0?' (今天)':''}</span><b style="color:${sh?sh.color:'#7b8496'}">${sh?`${sh.name} ${sh.start}-${sh.end}`:'休息'}</b></div>`}$('schList').innerHTML=h}
const TYPE={leave:'🏖️ 请假',overtime:'⏰ 加班',fix:'📝 补卡'};
function detail(q){if(q.type==='leave')return `${q.kind} ${q.date}${q.to!==q.date?' ~ '+q.to:''}（${q.days}天）`;if(q.type==='overtime')return `${q.date} 加班${q.hours}小时`;return `${q.date} 补${q.ptype==='in'?'上班':'下班'}卡 ${q.time}`}
function renderReq(){const L=DB.requests().filter(q=>q.empId===me.id);
  $('reqList').innerHTML=L.map(q=>`<div class="card"><div class="hd"><span>${TYPE[q.type]}</span><span class="chip c-${q.status}">${DB.stepName[q.status]}</span></div>${esc(detail(q))}<span class="sub">原因：${esc(q.reason)}</span>${q.history.map(h=>`<span class="sub">${h.act==='ok'?'✅':'❌'} ${esc(DB.emp(h.by).name)} ${h.act==='ok'?'批准':'拒绝'}${h.comment?'：'+esc(h.comment):''}</span>`).join('')}</div>`).join('')||'<p style="color:#7b8496">还没有申请</p>'}
function renderSet(){$('acctInfo').textContent=me.name+' · '+me.email;
  const o=DB.office();$('offInfo').textContent=o?`${o.name}，${o.radius}米内可打卡（由HR设定）`:'HR 还没有设定办公室位置，暂时不能打卡。'}
function pwSheet(){$('sheetBody').innerHTML=`<h3>修改密码</h3><div class="f"><label>新密码（至少8位）<input id="fPw" type="password" autocomplete="new-password"></label></div><p style="display:flex;gap:10px"><button class="btn g" style="background:#e8eef7;color:#333" onclick="$('sheet').classList.remove('show')">取消</button><button class="btn b" style="flex:1" onclick="savePw()">保存</button></p>`;$('sheet').classList.add('show')}
async function savePw(){const p=$('fPw').value;if(p.length<8)return toast('密码太短','至少8位',true);try{await DB.changeMyPassword(p);$('sheet').classList.remove('show');toast('密码已修改','')}catch(e){toast('没成功',e.message,true)}}
async function showPhoto(id){try{const p=await DB.photo(id);$('sheetBody').innerHTML=`<h3>打卡自拍</h3><p style="text-align:center"><img src="${p}" style="max-width:100%;border-radius:12px"></p><p><button class="btn b w" onclick="$('sheet').classList.remove('show')">关闭</button></p>`;$('sheet').classList.add('show')}catch(e){toast('打不开',e.message,true)}}

/* ---------- 申请表单 ---------- */
function form(type){
  const t=ymd(new Date());let h='';
  if(type==='leave')h=`<h3>🏖️ 请假</h3><div class="f"><label>假别<select id="fKind"><option>年假</option><option>病假</option><option>事假</option></select></label><label>从<input type="date" id="fFrom" value="${addDays(t,1)}"></label><label>到<input type="date" id="fTo" value="${addDays(t,1)}"></label><label>原因<input id="fWhy"></label></div>`;
  if(type==='overtime')h=`<h3>⏰ 加班申请</h3><div class="f"><label>加班日期<input type="date" id="fDate" value="${t}"></label><label>加班多久<select id="fHrs">${[.5,1,1.5,2,3,4,5,6].map(x=>`<option value="${x}">${x} 小时</option>`).join('')}</select></label><label>原因<input id="fWhy"></label></div>`;
  if(type==='fix')h=`<h3>📝 补卡申请</h3><div class="f"><label>哪一天<input type="date" id="fDate" value="${prevWork(t)}" max="${t}"></label><label>补哪一个<select id="fType"><option value="in">上班卡</option><option value="out">下班卡</option></select></label><label>应该打卡的时间<input type="time" id="fTime" value="09:00"></label><label>原因<input id="fWhy" placeholder="例如：忘记打卡"></label></div>`;
  $('sheetBody').innerHTML=h+`<p style="display:flex;gap:10px"><button class="btn g" style="background:#e8eef7;color:#333" onclick="$('sheet').classList.remove('show')">取消</button><button class="btn b" style="flex:1" onclick="submitForm('${type}')">提交</button></p>`;$('sheet').classList.add('show')}
let submitting=false;
async function submitForm(type){if(submitting)return;const why=$('fWhy').value.trim();if(!why)return toast('请填写原因','',true);let o={type,empId:me.id,reason:why};
  if(type==='leave'){const a=$('fFrom').value,b=$('fTo').value;if(!a||!b||b<a)return toast('日期不对','结束日期不能早于开始日期',true);let n=0;for(let d=a;d<=b;d=addDays(d,1))if(dow(d)%6!==0)n++;Object.assign(o,{kind:$('fKind').value,date:a,to:b,days:Math.max(1,n)})}
  if(type==='overtime')Object.assign(o,{date:$('fDate').value,hours:+$('fHrs').value});
  if(type==='fix')Object.assign(o,{date:$('fDate').value,ptype:$('fType').value,time:$('fTime').value});
  submitting=true;try{const q=await DB.addRequest(o);$('sheet').classList.remove('show');toast('已提交',DB.stepName[q.status]);go('requests')}catch(e){toast('提交没成功',e.message,true)}finally{submitting=false}}

/* ---------- 定位 / 打卡 ---------- */
function dist(a,b,c,d){const R=6371000,rad=x=>x*Math.PI/180,dl=rad(c-a),dn=rad(d-b);const h=Math.sin(dl/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function getPos(){return new Promise((ok,no)=>{if(!navigator.geolocation)return no(new Error('这个浏览器不支持定位'));
  navigator.geolocation.getCurrentPosition(p=>ok(p.coords),e=>no(new Error(e.code===1?'你没有允许定位，请在浏览器里打开定位权限':'暂时拿不到位置，请到信号好的地方再试')),{enableHighAccuracy:true,timeout:15000,maximumAge:0})})}
let busy=false;
async function clock(method){
  if(busy)return;busy=true;
  try{
    const s0=DB.summary(me.id,ymd(new Date()));
    if(s0.status==='请假')throw new Error('你今天请假，不需要打卡');
    const o=DB.office();if(!o)throw new Error('HR 还没有设定办公室位置，暂时不能打卡');
    $('mainLbl').textContent='正在定位…';
    const pos=await getPos();
    const m=dist(pos.latitude,pos.longitude,o.lat,o.lng);
    if(m>o.radius)throw new Error(`你离${o.name}还有约${Math.round(m)}米，需要在${o.radius}米内才能打卡`);
    const photo=await selfie();if(photo===null)throw new Error('已取消打卡');
    const type=DB.nextType(me.id);
    $('mainLbl').textContent='正在提交…';
    await DB.punch(me.id,type,{method,face:photo.face,photo:photo.img,lat:pos.latitude,lng:pos.longitude});
    render();toast(`${me.name} ${type==='in'?'上班打卡成功':'下班打卡成功'}`,`${photo.face?'人脸已验证':'已拍照记录'} · ${o.name}`);
  }catch(e){toast('打卡没成功',e.message,true);render()}
  finally{busy=false}}
let stream,camRes;
async function selfie(){
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false})}catch(e){throw new Error('打不开摄像头，请允许浏览器使用摄像头')}
  $('vid').srcObject=stream;$('cam').classList.add('show');$('camMsg').textContent='拍一张自拍作为打卡证明';return new Promise(r=>camRes=r)}
function stopCam(){stream&&stream.getTracks().forEach(t=>t.stop());$('cam').classList.remove('show')}
function camCancel(){stopCam();camRes(null)}
async function shoot(){const v=$('vid');if(!v.videoWidth){$('camMsg').textContent='摄像头还没准备好，等一下';return}
  const c=document.createElement('canvas'),w=160,h=Math.round(w*v.videoHeight/v.videoWidth);c.width=w;c.height=h;c.getContext('2d').drawImage(v,0,0,w,h);
  let face=false;if('FaceDetector' in window){try{face=(await new FaceDetector().detect(c)).length>0}catch(e){}if(!face){$('camMsg').textContent='没看到人脸，请正对镜头再拍';return}}
  stopCam();camRes({img:c.toDataURL('image/jpeg',.6),face})}
function wifi(){toast('WiFi 打卡','网页读不到WiFi名称，需要做成手机App才能用',true)}
async function nfc(){if(!('NDEFReader' in window))return toast('NFC 打卡','这台手机/浏览器不支持（安卓 Chrome 才行）',true);
  try{const r=new NDEFReader();await r.scan();toast('请把手机靠近打卡贴纸','');r.onreading=()=>{r.onreading=null;clock('NFC')}}catch(e){toast('NFC 没打开',e.message,true)}}

DB.boot(async m=>{me=m;go('home')});
</script>
